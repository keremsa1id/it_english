name: it_english
description: Learn the English words used in IT with definitions, sentences and a quiz.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.5.0
  http: ^1.2.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    # Alt klasörler ayrıca yazılmalı; Flutter klasörleri iç içe taramaz.
    - assets/data/weekly/
