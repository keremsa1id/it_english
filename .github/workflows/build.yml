name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        run: flutter create . --platforms=android --project-name it_english

      - name: Paketleri indir
        run: flutter pub get

      - name: Kodu analiz et
        run: flutter analyze

      - name: Testleri çalıştır
        run: flutter test

      - name: Release APK derle
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: it-english-apk
          path: build/app/outputs/flutter-apk/app-release.apk
