name: Test

# Her dalda ve her PR'da çalışır; böylece main'e gelmeden hatalar görülür.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      # Android derlemesi (aşağıdaki APK adımı) için.
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri indir
        run: flutter pub get

      - name: Kodu analiz et
        run: flutter analyze

      - name: Testleri çalıştır
        run: flutter test

      # Android ayarları (izinler, paket gereksinimleri) bozuksa main'e
      # gelmeden görülsün. Hızlı olsun diye debug derlenir; yayınlanacak
      # APK main'de Build APK workflow'unda derlenir.
      - name: Android derlemesini dene
        run: flutter build apk --debug
