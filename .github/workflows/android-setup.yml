name: Android klasörünü oluştur

# android/ klasörü yoksa `flutter create` ile üretir ve push yapılan dala
# commit'ler. Klasör zaten varsa hiçbir şey yapmadan biter. Sonrasında
# izin ayarları (mikrofon, bildirim) bu dosyalarda yapılır.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: android/ var mı?
        id: check
        run: |
          if [ -d android ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "android/ klasörü zaten var; bir şey yapılmayacak."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Flutter kur
        if: steps.check.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        if: steps.check.outputs.exists == 'false'
        run: flutter create . --platforms=android --project-name it_english

      - name: Commit'le ve gönder
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Android platform dosyalarını ekle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
